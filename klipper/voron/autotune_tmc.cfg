# sg4_thrs on X/Y: sensorless homing threshold (higher = more sensitive, 0-255).
# TMC Autotune OVERRIDES the [tmc2209] driver_SGTHRS with its own sg4_thrs at
# startup — the tuned value (115, 2026-10-09) must live HERE, not in overrides.cfg.
[autotune_tmc stepper_x]
motor: TB-3544
sg4_thrs: 115
[autotune_tmc stepper_y]
motor: TB-3544
sg4_thrs: 115
[autotune_tmc stepper_z]
motor: TB-3544
[autotune_tmc stepper_z1]
motor: TB-3544
[autotune_tmc stepper_z2]
motor: TB-3544
[autotune_tmc stepper_z3]
motor: TB-3544
[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
