# This file is yours! Feel free to edit it in order to include all the needed
# things to adapt my generic config to your machine. This file will not be erased
# when updating the config using moonraker and it will be kept as you've set it.
# You can change every section of the config. You can also add some new custom macros, etc...
# The corresponding documentation can be found in: docs > overrides.md

### Also, keep in mind: if you use a multi-MCU config such as the old school double SKRs or a CANbus toolhead
### board, you will need to specify which components are connected to which board in your own mcu.cfg file!
### Example: if something is connected to the toolhead MCU, you should use "config_pin: toolhead:PIN_NAME".

#> Main control MCUs are called "mcu" (and "secondary" when using a double MCU configuration)
#> Toolhead CANboard MCUs are called "toolhead"
#> MMU/ERCF MCUs are called "mmu" 

# ------------------------------------------------------------------------------------------


#-------------------------#
#   START_PRINT SEQUENCE  #
#-------------------------#

## The START_PRINT sequence is modular and fully customizable. A default START_PRINT sequence is auto-populated based on
## your probe choice (TAP, Dockable, Inductive), but if for some reasons you still want to modify it, please uncomment the following 3
## lines to define a new `variable_startprint_actions`. You can use any number of action or even duplicate some actions if needed.
## Available actions: "bed_soak", "extruder_preheating", "chamber_soak", "extruder_heating", "tilt_calib", "z_offset", "bedmesh", "purge", "clean", "primeline"
##
# [gcode_macro _USER_VARIABLES]
# variable_startprint_actions: "action1", "action2", ...
# gcode: # do not remove this line


#-------------------------#
#   EXTRUDER/BED PIDs     #
#-------------------------#

## Here is an example of some overrides for the PIDs. I put them here as almost everyone will use them,
## so just uncomment the following lines and change the values according to your own machine
[extruder]
sensor_type: MAX31865#ATC Semitec 104GT-2
sensor_pin: toolhead:MCU_SPI1_CS # TE0 Position
# spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2

min_temp: 0
max_temp: 290
max_power: 1.0
min_extrude_temp: 10
max_extrude_cross_section: 5 #required by KAMP

spi_speed: 1000000
#   The SPI speed (in hz) to use when communicating with the chip.
#   The default is 4000000.
spi_software_miso_pin: toolhead:MCU_SPI1_MISO
spi_software_mosi_pin: toolhead:MCU_SPI1_MOSI
spi_software_sclk_pin: toolhead:MCU_SPI1_SCLK
control: pid
pid_Kp:24.777
pid_Ki:2.360
pid_Kd:65.039

[heater_bed]
control: pid
pid_Kp: 39.755
pid_Ki: 1.433
pid_Kd: 275.79

#-------------------------#
#    MOTORS DIRECTION    #
#-------------------------#
[stepper_x]
dir_pin: !X_DIR
position_min: 0
position_max: 342 # Xol carriage: physical travel is +12mm vs stock (measured 2026-10-09: nozzle 12mm inside edge at commanded X=0)
position_endstop: 342

[stepper_y]
dir_pin: !Y_DIR


#-------------------------#
#   Z1_ENABLE MOTORS DIRECTION    #
#-------------------------#

#Z1_TMCUARTxample of some overrides for the motor directions as it's a pretty common one. If you need
## to invert the Z1 or Z3 motor direction on your machine, just uncomment the following lines.
# [stepper_z1]
# dir_pin: !Z1_DIR
[stepper_z]
step_pin: Z_STEP
dir_pin: !Z_DIR
enable_pin: !Z_ENABLE

[tmc2209 stepper_z]
uart_pin: Z_TMCUART

[stepper_z1]
step_pin: Z1_STEP
dir_pin: Z1_DIR
enable_pin: !Z1_ENABLE

[tmc2209 stepper_z1]
uart_pin: Z1_TMCUART
 
[stepper_z2]
step_pin: Z2_STEP
dir_pin: !Z2_DIR
enable_pin: !Z2_ENABLE

[tmc2209 stepper_z2]
uart_pin: Z2_TMCUART

[stepper_z3]
step_pin: Z3_STEP
dir_pin: Z3_DIR
enable_pin: !Z3_ENABLE

[tmc2209 stepper_z3]
uart_pin: Z3_TMCUART

#-------------------------#
#   Probe Offsets         #
#-------------------------#

## Cartographer (TAP removed 2026-10, Xol carriage + sensorless homing).
## Old TAP z_offset -0.852 does not apply: z_offset now lives in the touch_model
## sections written by CARTOGRAPHER_TOUCH_CALIBRATE + SAVE_CONFIG.
[cartographer]
x_offset: 0
y_offset: 21.1 # initial estimate for Xol carriage — verify physically (Task 5), then update

#-------------------------#
#        Nevermore        #
#-------------------------#

[nevermore]
bt_address: 28:CD:C1:10:EC:B0
fan_power_coefficient: 0.8
connection_initial_timeout: 50


#-------------------------#
#        Extra Fan        #
#-------------------------#

# [temperature_fan mobo_fan]
# pin: mcu:MCU_FAN4
# kick_start_time: 0.5
# max_speed: 0.75
# target_temp: 50
# min_temp: 10
# max_temp: 95
# control: watermark
# sensor_type: temperature_host



[adxl345] # replace "adxl345" by your correct accelerometer name
axes_map: x, z, -y

#-------------------------#
#        Caselight        #
#-------------------------#


# Caselight: 2x25 LED strips in series = 50 LEDs (klippain assumes 31)
[neopixel caselight]
chain_count: 50

## Idle State - Rainbow breathing
[led_effect cl_standby]
leds:
    neopixel:caselight
autostart: false
frame_rate: 24
layers:
    breathing 10 1 top (0.30, 0.0, 0.0),(0.0, 0.30, 0.0),(0.0, 0.0, 0.30)

## Busy State - Red comet
[led_effect cl_busy]
leds:
    neopixel:caselight
autostart: false
frame_rate: 24
layers:
    comet 1 1 top (0.5, 0.0, 0.0),(0.3, 0.0, 0.0)

## Heating State - Bed temperature gauge (0-110 C) + dim red base
[led_effect cl_heating]
leds:
    neopixel:caselight
autostart: false
frame_rate: 24
heater: heater_bed
layers:
    temperaturegauge 0 110 add (1.0, 0.25, 0.0),(0.9, 0.05, 0.0)
    breathing 4 0.3 add (0.35, 0.0, 0.0)

# Layer order matters: the first line is the topmost layer. The static
# base must be listed last, otherwise it wipes the progress bar.
## Printing State - Dim base + progress bar
[led_effect cl_printing]
leds:
    neopixel:caselight
autostart: false
frame_rate: 24
layers:
    progress -1 0 add (1.0, 1.0, 1.0),(0.0, 0.1, 0.4)
    static 0 0 top (0.05, 0.05, 0.07)

## Done Printing State - Everything off
[led_effect cl_done_printing]
leds:
    neopixel:caselight
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 0.0)

[led_effect sb_logo_done_printing]
leds:
    neopixel:status_leds (1)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 0.0)

[led_effect sb_nozzle_done_printing]
leds:
    neopixel:status_leds (2,3)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 0.0)

## Off State - ALL LEDs off (klippain's cl_off only turns off LED #1)
[led_effect cl_off]
leds:
    neopixel:caselight
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 0.0)

## Critical error - both strips (klippain defines it twice; this wins)
[led_effect critical_error]
leds:
    neopixel:caselight
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    strobe 1 1.5 add (1.0, 1.0, 1.0)
    breathing 2 0 difference (0.95, 0.0, 0.0)
    static 1 0 top (1.0, 0.0, 0.0)
    
[idle_timeout] 
timeout: 3600
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
        M118 Timeout Reached - Heaters and Motors Still On!
        M117 Timeout Reached - Heaters and Motors Still On!
        #TURN_OFF_HEATERS
        #M84
    {% endif %}


#-------------------------#
#   Sensorless homing     #
#-------------------------#

## Manta M8P v2: X motor in slot M1 (DIAG -> PF4 = MCU_M1_STOP), Y in slot M2 (DIAG -> PF3 = MCU_M2_STOP).
## klippain's sensorless_TMC2209.cfg uses the crossed X_STOP/Y_STOP aliases, so pin the correct DIAGs here.
[tmc2209 stepper_x]
diag_pin: ^MCU_M1_STOP
driver_SGTHRS: 115 # TMC2209: higher = more sensitive (255 = max). Tuned 2026-10-09.

[tmc2209 stepper_y]
diag_pin: ^MCU_M2_STOP
driver_SGTHRS: 115 # TMC2209: higher = more sensitive (255 = max). Tuned 2026-10-09.
