[input_shaper]
shaper_type_x: mzv # filter type for the X axis
shaper_freq_x: 58.8 # center frequency for the X axis filter (SHAPER_CALIBRATE 2026-10-09, Xol carriage)
damping_ratio_x: 0.054  # damping ratio for the X axis

shaper_type_y: mzv # filter type for the Y axis
shaper_freq_y: 42.4 # center frequency for the Y axis filter (SHAPER_CALIBRATE 2026-10-09, Xol carriage)
damping_ratio_y: 0.059 # damping ratio for the Y axis
